<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卑弥呼ちゃん 〜邪馬台国ものしり問答〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --sumi:#1b1410;       /* 墨 */
    --sumi2:#241c15;
    --kin:#d9a441;        /* 金 */
    --kin-akarui:#f4d27a;
    --aka:#b8462f;        /* 朱（弥生の水銀朱イメージ） */
    --aka-fuka:#7d241c;
    --washi:#f5ecd9;      /* 生成り */
    --washi-kage:#e8d9bb;
    --midori:#5c7a4a;
    --sumi-usu:rgba(245,236,217,.7);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Zen Maru Gothic',sans-serif;
    background:
      radial-gradient(ellipse at 50% -8%, #5a3f22 0%, transparent 55%),
      radial-gradient(ellipse at 50% 120%, #2a1d12 0%, transparent 55%),
      var(--sumi);
    color:var(--washi);
    min-height:100%;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }
  /* 和紙テクスチャ風のノイズ */
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
    pointer-events:none;z-index:0;
  }

  /* ヘッダー */
  header{
    position:relative;z-index:2;
    text-align:center;
    padding:18px 16px 10px;
    border-bottom:3px solid var(--kin);
    background:linear-gradient(180deg, rgba(184,70,47,.32), transparent);
  }
  .mon{
    display:inline-flex;align-items:center;gap:14px;
  }
  .mon-maru{
    width:46px;height:46px;border-radius:50%;
    border:3px solid var(--kin);
    display:grid;place-items:center;
    font-family:'Yuji Syuku',serif;font-size:24px;color:var(--kin-akarui);
    background:radial-gradient(circle,#5a3f22,#1b1410);
  }
  h1{
    font-family:'Yuji Syuku',serif;
    font-size:clamp(28px,4.2vw,52px);
    color:var(--kin-akarui);
    letter-spacing:.12em;
    text-shadow:0 2px 0 #000,0 0 18px rgba(244,210,122,.4);
  }
  .sub{
    font-size:clamp(13px,1.5vw,18px);
    color:var(--sumi-usu);
    margin-top:4px;letter-spacing:.18em;
  }

  /* メイン舞台 */
  main{
    position:relative;z-index:2;
    flex:1;
    width:min(1100px,94vw);
    margin:0 auto;
    padding:22px 0 30px;
    display:flex;flex-direction:column;gap:20px;
  }

  /* 卑弥呼の語り場 */
  .stage{
    display:flex;align-items:flex-start;gap:22px;
  }
  .himiko{
    flex:0 0 auto;
    width:clamp(120px,15vw,180px);
    text-align:center;
  }
  .face{
    width:clamp(120px,15vw,180px);
    height:clamp(120px,15vw,180px);
    border-radius:50%;
    overflow:hidden;
    background:#241c15;
    border:5px solid var(--kin);
    box-shadow:0 0 0 4px var(--sumi),0 10px 30px rgba(0,0,0,.5);
    position:relative;
  }
  .face .mouth{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .face .mouth.closed{z-index:1;}              /* 口を閉じた絵：いつも見えている */
  .face .mouth.open{z-index:2;opacity:0;}      /* 口を開けた絵：ふだんは透明で重ねておく */
  .face.talking-open .mouth.open{opacity:1;}   /* しゃべる瞬間だけ見える */
  .face.no-img .mouth{display:none;}
  .face-fallback{
    display:none;
    width:100%;height:100%;
    align-items:center;justify-content:center;
    font-family:'Yuji Syuku',serif;
    font-size:clamp(20px,2.6vw,32px);line-height:1.15;
    color:var(--kin-akarui);letter-spacing:.05em;
    background:radial-gradient(circle at 50% 38%, #5a3f22, #1b1410);
  }
  .face.no-img .face-fallback{display:flex;}
  .name-tag{
    margin-top:10px;font-family:'Yuji Syuku',serif;
    font-size:clamp(16px,2vw,24px);color:var(--kin-akarui);letter-spacing:.1em;
  }

  /* 吹き出し（巻物風） */
  .scroll{
    flex:1;position:relative;
    background:linear-gradient(180deg,var(--washi),var(--washi-kage));
    color:var(--sumi);
    border-radius:14px;
    padding:26px 30px;
    min-height:170px;
    box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 0 0 3px rgba(125,36,28,.25);
    border:2px solid var(--kin);
  }
  .scroll::before{ /* 吹き出しのしっぽ */
    content:"";position:absolute;left:-18px;top:48px;
    border-style:solid;border-width:14px 18px 14px 0;
    border-color:transparent var(--kin) transparent transparent;
  }
  .scroll .answer{
    font-family:'Klee One',serif;
    font-size:clamp(20px,2.6vw,32px);
    line-height:1.75;font-weight:600;
    letter-spacing:.02em;
  }
  .scroll .answer .em{color:var(--aka-fuka);font-weight:700;}
  .cursor{display:inline-block;width:.5em;background:var(--aka);animation:blink .7s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}

  /* 質問エリア */
  .ask-zone{
    background:rgba(36,28,21,.7);
    border:2px solid var(--kin);
    border-radius:14px;
    padding:18px 20px;
  }
  .ask-zone .label{
    font-size:clamp(15px,1.7vw,20px);color:var(--kin-akarui);
    margin-bottom:12px;letter-spacing:.1em;font-weight:700;
  }
  .input-row{display:flex;gap:12px;flex-wrap:wrap;}
  #q{
    flex:1;min-width:220px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:clamp(18px,2.2vw,26px);font-weight:500;
    padding:14px 18px;border-radius:10px;border:none;
    background:var(--washi);color:var(--sumi);
  }
  #q:focus{outline:3px solid var(--kin-akarui);}
  .btn-ask{
    font-family:'Yuji Syuku',serif;
    font-size:clamp(18px,2.2vw,26px);
    padding:14px 28px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,var(--aka),var(--aka-fuka));
    color:var(--washi);letter-spacing:.1em;
    box-shadow:0 4px 0 #511712,0 6px 14px rgba(0,0,0,.4);
    transition:transform .08s;
  }
  .btn-ask:active{transform:translateY(4px);box-shadow:0 1px 0 #511712;}

  /* モード切替タブ */
  .mode-tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .tab{
    font-family:'Yuji Syuku',serif;
    font-size:clamp(16px,2vw,24px);
    padding:10px 26px;border-radius:999px;cursor:pointer;
    background:rgba(245,236,217,.08);
    color:var(--washi);
    border:2px solid var(--kin);
    transition:all .15s;letter-spacing:.08em;
  }
  .tab:hover{transform:translateY(-2px);}
  .tab.active{background:linear-gradient(180deg,var(--aka),var(--aka-fuka));color:var(--washi);border-color:var(--kin-akarui);box-shadow:0 3px 0 #511712;}

  /* パネル切替 */
  .panel{display:none;}
  .panel.show{display:block;}

  /* クイズ */
  .quiz-zone{
    background:rgba(36,28,21,.7);
    border:2px solid var(--kin);
    border-radius:14px;
    padding:18px 20px;
  }
  .quiz-score{font-size:clamp(15px,1.7vw,20px);color:var(--kin-akarui);font-weight:700;margin-bottom:14px;letter-spacing:.06em;}
  .quiz-choices{display:flex;flex-direction:column;gap:12px;}
  .choice{
    font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
    font-size:clamp(17px,2vw,24px);
    text-align:left;
    padding:14px 20px;border-radius:12px;cursor:pointer;
    background:var(--washi);color:var(--sumi);
    border:3px solid transparent;
    transition:all .12s;
  }
  .choice:hover:not(:disabled){border-color:var(--aka);transform:translateY(-2px);}
  .choice:disabled{cursor:default;opacity:.95;}
  .choice.correct{background:#bfe3a8;border-color:#4e8b34;color:#274d1a;}
  .choice.wrong{background:#f0b6ad;border-color:#a83422;color:#5a160e;}
  .quiz-next{
    margin-top:16px;
    font-family:'Yuji Syuku',serif;font-size:clamp(17px,2vw,24px);
    padding:12px 26px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,var(--aka),var(--aka-fuka));color:var(--washi);
    letter-spacing:.08em;box-shadow:0 4px 0 #511712;
  }
  .quiz-next:active{transform:translateY(4px);box-shadow:0 1px 0 #511712;}

  /* 地図 */
  .map-zone{
    background:rgba(36,28,21,.7);
    border:2px solid var(--kin);
    border-radius:14px;
    padding:18px 20px;
  }
  .map-legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;font-size:clamp(14px,1.6vw,19px);font-weight:700;}
  .legend-item{display:inline-flex;align-items:center;gap:8px;color:var(--washi);}
  .legend-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--washi);}
  .legend-kyushu{background:var(--aka);}
  .legend-kinai{background:#5b8fd6;}
  .map-wrap{width:100%;max-width:560px;margin:0 auto;}
  .map-wrap svg{width:100%;height:auto;display:block;}
  .pin{cursor:pointer;transition:transform .12s;transform-box:fill-box;transform-origin:center;}
  .pin:hover{transform:scale(1.25);}
  .pin-label{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;fill:var(--washi);font-size:13px;pointer-events:none;}
  .map-hint{font-size:clamp(13px,1.5vw,17px);color:var(--sumi-usu);margin-top:10px;letter-spacing:.05em;}
  #mapWrap svg{background:#16324a;border-radius:10px;}
  #mapWrap .prefecture polygon,#mapWrap .prefecture path{fill:#e9ddc0;stroke:#9c7b46;stroke-width:1.1;}
  #mapWrap .prefecture[data-code="40"] polygon,#mapWrap .prefecture[data-code="40"] path{fill:var(--aka);}   /* 福岡＝九州説 */
  #mapWrap .prefecture[data-code="29"] polygon,#mapWrap .prefecture[data-code="29"] path{fill:#5b8fd6;}      /* 奈良＝畿内説 */
  .site-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .site-item{display:flex;align-items:center;gap:10px;text-align:left;
    font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:clamp(15px,1.8vw,20px);
    padding:10px 14px;border-radius:10px;cursor:pointer;background:var(--washi);color:var(--sumi);
    border:2px solid var(--kin);transition:all .12s;}
  .site-item:hover{transform:translateY(-2px);}
  .site-n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
    border-radius:50%;color:#fff;font-weight:900;flex:0 0 auto;}

  footer{
    position:relative;z-index:2;text-align:center;
    font-size:13px;color:rgba(245,236,217,.4);
    padding:14px;letter-spacing:.1em;
  }
  @media(max-width:560px){
    .stage{flex-direction:column;align-items:center;}
    .scroll::before{display:none;}
    .himiko{order:-1;}
    .pin-label{font-size:15px;}
  }
</style>
</head>
<body>
  <header>
    <div class="mon">
      <span class="mon-maru">日</span>
      <div>
        <h1>卑弥呼ちゃん</h1>
        <div class="sub">やまたいこく ものしり もんどう</div>
      </div>
      <span class="mon-maru">巫</span>
    </div>
  </header>

  <main>
    <div class="stage">
      <div class="himiko">
        <div class="face" id="face">
          <img class="mouth closed"
               src="https://raw.githubusercontent.com/byakusen/ggeoge.himiko_illust/main/himiko.png"
               alt="卑弥呼（口を閉じた絵）"
               onerror="this.closest('.face').classList.add('no-img');">
          <img class="mouth open"
               src="https://raw.githubusercontent.com/byakusen/ggeigelge.himiko_chan/main/himiko2.png"
               alt="" aria-hidden="true">
          <span class="face-fallback">卑<br>弥<br>呼</span>
        </div>
        <div class="name-tag">卑弥呼</div>
      </div>
      <div class="scroll">
        <div class="answer" id="answer"></div>
      </div>
    </div>

    <div class="mode-tabs">
      <button class="tab active" id="tab-ask">もんどう</button>
      <button class="tab" id="tab-quiz">クイズ</button>
      <button class="tab" id="tab-map">ちず（場所さがし）</button>
    </div>

    <!-- もんどうモード -->
    <div class="panel show" id="panel-ask">
      <div class="ask-zone">
        <div class="label">▼ 卑弥呼ちゃんに きいてみよう</div>
        <div class="input-row">
          <input id="q" type="text" placeholder="しつもんを 入力してね（れい：邪馬台国ってなに？）" autocomplete="off">
          <button class="btn-ask" id="askBtn">きく</button>
        </div>
      </div>
    </div>

    <!-- クイズモード -->
    <div class="panel" id="panel-quiz">
      <div class="quiz-zone">
        <div class="quiz-score" id="quizScore">せいかい： 0 もん ／ 0 もん</div>
        <div class="quiz-choices" id="quizChoices"></div>
        <button class="quiz-next" id="quizNext" style="display:none;">つぎの もんだい →</button>
      </div>
    </div>

    <!-- 地図モード -->
    <div class="panel" id="panel-map">
      <div class="map-zone">
        <div class="map-legend">
          <span class="legend-item"><span class="legend-dot legend-kyushu"></span>九州説（きゅうしゅうせつ）</span>
          <span class="legend-item"><span class="legend-dot legend-kinai"></span>畿内説（きないせつ）</span>
        </div>
        <div class="map-wrap" id="mapWrap">

// 入力にいちばん合う答えをさがす
function findAnswer(text){
  const t = (text||"").replace(/\s/g,"");
  if(!t) return null;
  let best=null, bestScore=0;
  for(const item of KB){
    let score=0;
    for(const k of item.keys){ if(t.includes(k)) score += k.length; }
    if(score>bestScore){bestScore=score; best=item;}
  }
  return bestScore>0 ? best.a : null;
}

const answerEl = document.getElementById('answer');

// ===== 口パク（しゃべっている間だけ口を動かす） =====
let mouthTimer=null;
function startMouth(){
  stopMouth();                                   // 念のため前の動きを止める
  mouthTimer=setInterval(()=>{ faceEl.classList.toggle('talking-open'); },130); // 0.13秒ごとに開け閉め
}
function stopMouth(){
  if(mouthTimer){ clearInterval(mouthTimer); mouthTimer=null; }
  faceEl.classList.remove('talking-open');       // 最後は口を閉じた絵にもどす
}

function speak(text){
  startMouth();                                  // しゃべりはじめ
  if(typing) clearInterval(typing);
  answerEl.innerHTML="";
  let i=0;
  const cursor=document.createElement('span');
  cursor.className='cursor'; cursor.textContent='　';
  answerEl.appendChild(cursor);
  typing=setInterval(()=>{
    if(i>=text.length){clearInterval(typing); cursor.remove(); stopMouth(); return;} // しゃべりおわり
    const ch=document.createTextNode(text[i]);
    answerEl.insertBefore(ch,cursor);
    i++;
  },32);
}

function handleAsk(text){
  const a = findAnswer(text);
  if(a){ speak(a); }
  else{ speak(NOT_FOUND[Math.floor(Math.random()*NOT_FOUND.length)]); }
}

const tabs={

}

const quizScoreEl=document.getElementById('quizScore');
const quizChoicesEl=document.getElementById('quizChoices');
const quizNextEl=document.getElementById('quizNext');
let quizCorrect=0, quizTotal=0, quizCur=null, quizAnswered=false;

function updateScore(){ quizScoreEl.textContent=`せいかい： ${quizCorrect} もん ／ ${quizTotal} もん`; }

function shuffle(arr){ // 選択肢をまぜる（正解の位置を返す）
  const a=arr.map((t,i)=>({t,orig:i}));
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function newQuestion(){
  quizAnswered=false;
  quizNextEl.style.display='none';
  quizCur=QUIZ[Math.floor(Math.random()*QUIZ.length)];
  speak("【クイズ】"+quizCur.q);
  const mixed=shuffle(quizCur.c);
  quizChoicesEl.innerHTML="";
  mixed.forEach(item=>{
    const b=document.createElement('button');
    b.className='choice'; b.textContent=item.t;
    b.onclick=()=>chooseAnswer(b,item.orig===quizCur.ans,mixed);
    quizChoicesEl.appendChild(b);
  });
}

function chooseAnswer(btn,isCorrect,mixed){
  if(quizAnswered) return;
  quizAnswered=true;
  quizTotal++;
  const btns=quizChoicesEl.querySelectorAll('.choice');
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(mixed[i].orig===quizCur.ans) b.classList.add('correct');
  });
  if(isCorrect){ quizCorrect++; speak("せいかい！　"+quizCur.exp); }
  else{ btn.classList.add('wrong'); speak("ざんねん、ちがうのじゃ。正しい答えは緑のところよ。"+quizCur.exp); }
  updateScore();
  quizNextEl.style.display='inline-block';
}

function startQuiz(){
  quizCorrect=0; quizTotal=0; updateScore();
  newQuestion();
}
quizNextEl.onclick=newQuestion;

   exp:"福岡県糸島市の平原(ひらばる)遺跡じゃ。女性とみられる人の墓から、大きな鏡が何枚も見つかった。その鏡が伝説の宝「八咫鏡(やたのかがみ)」と同じ大きさでな、太陽をうつす鏡をもつ女――これこそ卑弥呼の墓では、と考える学者がおる。九州説の有力な手がかりよ。"},
  {n:2,name:"石塚山（いしづかやま）古墳",pref:"福岡県",theory:"kyushu",x:131,y:757,
   exp:"福岡県苅田町(かんだまち)の石塚山(いしづかやま)古墳じゃ。つくられた時期が3世紀ごろで、中国の鏡などが見つかっておる。九州にある古い古墳でな、これもわらわの墓の候補の一つとされておる。"},
  {n:3,name:"祇園山（ぎおんやま）古墳",pref:"福岡県",theory:"kyushu",x:107,y:793,
   exp:"福岡県久留米市の祇園山(ぎおんやま)古墳じゃ。つくられた時期が3世紀の中ごろで、まわりにたくさんの墓があることなどが、記録(殉葬・じゅんそう)とよく合うと言われる。これもわらわの墓の候補の一つよ。九州説じゃな。"},
  {n:4,name:"箸墓（はしはか）古墳",pref:"奈良県",theory:"kinai",x:395,y:730,
   exp:"奈良県桜井市の箸墓(はしはか)古墳じゃ。とても大きな前方後円墳でな、邪馬台国が奈良にあったとする「畿内説」の人々は、これをわらわの墓ではと考えておる。じゃが、大きさが記録と合わぬ、という反対の声もある。畿内説の大本命よ。"}
];
const SVGNS="http://www.w3.org/2000/svg";
function tellSite(p){
  const setsu=p.theory==='kyushu'?'九州説':'畿内説';
  speak(`【${p.name}・${p.pref}】（${setsu}）　`+p.exp);
}
function buildMap(){
  const pinsG=document.getElementById('map-pins');
  const list=document.getElementById('mapList');
  MAP_PINS.forEach(p=>{
    const col=p.theory==='kyushu'?'#b8462f':'#5b8fd6';
    // 地図上のピン
    const g=document.createElementNS(SVGNS,'g');
    g.setAttribute('class','pin');
    const c=document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r','11');
    c.setAttribute('fill',col);c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','2.5');
    const tx=document.createElementNS(SVGNS,'text');
    tx.setAttribute('x',p.x);tx.setAttribute('y',p.y);tx.setAttribute('dy','5');
    tx.setAttribute('text-anchor','middle');tx.setAttribute('fill','#fff');
    tx.setAttribute('font-weight','700');tx.setAttribute('font-size','14');
    tx.setAttribute('font-family',"'Zen Maru Gothic',sans-serif");
    tx.textContent=p.n;
    g.appendChild(c);g.appendChild(tx);
    g.addEventListener('click',()=>tellSite(p));
    pinsG.appendChild(g);
    // 下のリスト
    const li=document.createElement('button');
    li.className='site-item';
    const num=document.createElement('span');
    num.className='site-n';num.style.background=col;num.textContent=p.n;
    li.appendChild(num);
    li.appendChild(document.createTextNode(`${p.name}（${p.pref}）`));
    li.onclick=()=>tellSite(p);
    list.appendChild(li);
  });
}
buildMap();

// 最初のあいさつ
speak(GREET);
</script>
